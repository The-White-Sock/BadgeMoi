name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# Un groupe par PR : repousser sur une PR annule le run devenu caduc.
#
# Sur `main`, en revanche, `github.ref` est le même pour tous les commits : annuler
# ferait tuer la validation du commit précédent par le suivant. Deux merges rapprochés
# — ce que l'auto-merge de Dependabot produit facilement — et un état de `main` ne
# serait jamais validé, sans que rien n'apparaisse en rouge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurer le JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Compilation debug
        run: ./gradlew assembleDebug

      - name: Publier l'APK de test (artifact CI, pas une release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badgemoi-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
