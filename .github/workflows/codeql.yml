name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # tous les lundis, indépendamment des changements de code

# Même règle que pour Android CI : on annule sur une PR, jamais sur `main`. Ici l'enjeu
# est plus lourd — un run annulé sur `main` laisse l'état de référence du code scanning
# accroché à un commit ancien, silencieusement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet pour differ la base de la PR (détection ci-dessous).
          fetch-depth: 0

      # Sur une PR qui ne touche à aucun code compilé (doc, config, autres
      # workflows…), l'analyse CodeQL n'apporte rien : on saute alors les étapes
      # coûteuses. Le job se termine quand même en succès, donc le check requis
      # « analyze » reste vert — sans attendre ~2-3 min de compilation inutile.
      # Hors PR (push main, cron), on analyse toujours.
      - name: Détecter les changements de code
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          # `build.gradle.kts` et `settings.gradle.kts` à la racine comptent : y ajouter
          # un plugin change ce que produit le compilateur, donc ce que CodeQL voit.
          if printf '%s\n' "$changed" \
            | grep -qE '^app/|^gradle/|^gradle\.properties$|^gradlew|^build\.gradle\.kts$|^settings\.gradle\.kts$|^\.github/workflows/codeql\.yml$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Aucun changement de code compilé — analyse CodeQL sautée."
          fi

      - name: Configurer le JDK
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle
        if: steps.changes.outputs.code == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        # Cache des dépendances conservé (téléchargements Maven/Gradle, distribution
        # Gradle) pour accélérer le job. La fraîcheur de compilation dont CodeQL a
        # besoin est garantie par `clean … --no-build-cache` ci-dessous, qui désactive
        # le *build cache* de tâches — c'est lui, et non le cache de dépendances, qui
        # court-circuiterait le compilateur Kotlin.

      - name: Initialiser CodeQL
        if: steps.changes.outputs.code == 'true'
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compilation debug (sans cache, pour que CodeQL trace la compilation)
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew clean assembleDebug --no-build-cache

      - name: Analyse CodeQL
        if: steps.changes.outputs.code == 'true'
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
